[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoard-link"
version = "0.2.0"
description = "Shared local model backend resolution for agent-controlled apps: pick the already-loaded llama.cpp/Ollama/ComfyUI server for a capability, or Faustus's registry, without ever loading a second copy of a model."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Salet" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.urls]
Repository = "https://github.com/Luissalet/HoardLink"
Homepage = "https://github.com/Luissalet/HoardLink"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "psutil>=5.9"]
hub = ["psutil>=5.9"]
desktop = ["psutil>=5.9", "pywebview>=5.0"]

[project.scripts]
hoard-hub = "hoard_link.hub.__main__:main"

[tool.setuptools.packages.find]
include = ["hoard_link*"]

[tool.setuptools.package-data]
"hoard_link.hub" = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
