<!doctype html>
<html lang="en" data-hoard-app="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoard Hub</title>
<link rel="icon" href="/ui/hub-icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1b1916">
<link rel="stylesheet" href="/ui/hoard-theme.css">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/ui/hub-icon.svg" alt="" width="36" height="36">
    <div>
      <h1>Hoard Hub</h1>
      <div class="sub" id="counts">…</div>
    </div>
  </div>
  <div class="top-actions">
    <input id="search" type="search" placeholder="Filter…" autocomplete="off">
    <button id="btn-start-all" class="ghost" data-i18n="start_all">Start all</button>
    <button id="btn-stop-all" class="ghost danger" data-i18n="stop_all">Stop all</button>
    <button id="btn-rescan" class="ghost" data-i18n="rescan" title="Re-read the app folders">Rescan</button>
    <button id="btn-lang" class="ghost small" title="Idioma / Language">ES</button>
  </div>
</header>

<section class="strip" id="strip">
  <div class="faustus" id="faustus"></div>
  <div class="backends" id="backends"></div>
  <div class="profiles services" id="services" hidden></div>
</section>

<section class="gpu-panel" id="gpu-panel">
  <div class="gpu-head">
    <button id="gpu-toggle" class="ghost small" aria-expanded="true"><b>GPU</b> <span id="gpu-summary"></span></button>
  </div>
  <div id="gpu-body" class="gpu-body">
    <div id="gpu-cards" class="gpu-cards"></div>
    <div id="gpu-leases" class="gpu-leases"></div>
  </div>
</section>

<section class="family-panel" id="family-panel">
  <div class="family-head">
    <nav class="tabs" id="family-tabs">
      <button data-tab="events" class="tab on"><b data-i18n="f_events">Events</b> <span id="events-badge" class="badge"></span></button>
      <button data-tab="rules" class="tab"><b data-i18n="f_rules">Rules</b> <span id="rules-badge" class="badge"></span></button>
      <button data-tab="jobs" class="tab"><b data-i18n="f_jobs">Jobs</b> <span id="jobs-badge" class="badge"></span></button>
      <button data-tab="backups" class="tab"><b data-i18n="f_backups">Backups</b> <span id="backups-badge" class="badge"></span></button>
      <button data-tab="audit" class="tab"><b data-i18n="f_audit">Audit</b> <span id="audit-badge" class="badge"></span></button>
      <button data-tab="repos" class="tab"><b data-i18n="f_repos">Repos</b> <span id="repos-badge" class="badge"></span></button>
    </nav>
    <button id="family-toggle" class="ghost small" aria-expanded="true">▾</button>
  </div>
  <div id="family-body" class="family-body">
    <div id="tab-events" class="tab-body">
      <div class="tab-tools">
        <input id="events-filter" type="search" placeholder="type glob (scribe.*, agent.call)…" autocomplete="off">
        <input id="events-source" type="search" placeholder="source" autocomplete="off" class="narrow">
        <button id="events-emit" class="ghost small" data-i18n="f_emit_test">Emit test event</button>
        <span id="events-live" class="live" title="Server-Sent Events">● live</span>
      </div>
      <div id="events-list" class="events-list"></div>
    </div>
    <div id="tab-rules" class="tab-body" hidden>
      <div class="tab-tools">
        <button id="rule-new" class="primary small" data-i18n="f_new_rule">New rule</button>
        <span class="hint" data-i18n="f_rules_hint">When an event matches, run actions. Templates below.</span>
      </div>
      <div id="rules-list" class="rules-list"></div>
      <details class="examples"><summary data-i18n="f_templates">Templates</summary><div id="rules-examples"></div></details>
      <div id="rules-history" class="history"></div>
    </div>
    <div id="tab-jobs" class="tab-body" hidden>
      <div class="tab-tools">
        <button id="job-new" class="primary small" data-i18n="f_new_job">New job</button>
        <span class="hint" data-i18n="f_jobs_hint">Actions on a clock: every 6h, or daily at 04:00.</span>
      </div>
      <div id="jobs-list" class="rules-list"></div>
      <details class="examples"><summary data-i18n="f_templates">Templates</summary><div id="jobs-examples"></div></details>
      <div id="jobs-history" class="history"></div>
    </div>
    <div id="tab-backups" class="tab-body" hidden>
      <div class="tab-tools">
        <button id="backup-run" class="primary small" data-i18n="f_backup_now">Back up now</button>
        <button id="backup-verify" class="ghost small" data-i18n="f_verify">Verify latest</button>
        <button id="backup-prune" class="ghost small" data-i18n="f_prune">Prune (keep 14)</button>
        <span id="backup-summary" class="hint"></span>
      </div>
      <div id="backups-list" class="rules-list"></div>
    </div>
    <div id="tab-audit" class="tab-body" hidden>
      <div class="tab-tools">
        <button id="audit-run" class="primary small" data-i18n="f_audit_run">Run audit</button>
        <span id="audit-summary" class="hint"></span>
      </div>
      <div id="audit-recs" class="recs"></div>
      <div id="audit-table" class="audit"></div>
    </div>
    <div id="tab-repos" class="tab-body" hidden>
      <div class="tab-tools">
        <span id="repos-summary" class="repo-chips"></span>
        <button id="repos-refresh" class="primary small" data-i18n="f_repos_refresh">Refresh</button>
      </div>
      <div class="tab-tools">
        <span id="repos-filters" class="repo-chips"></span>
        <input id="repos-filter" type="search" placeholder="repo, branch, issue…" autocomplete="off" class="narrow">
      </div>
      <div id="repos-table" class="audit repos"></div>
    </div>
  </div>
</section>

<main>
  <div id="profiles" class="profiles" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden></div>
</main>

<footer class="foot" id="foot"></footer>

<div id="toasts" class="toasts"></div>

<dialog id="log-dialog">
  <div class="dialog-head">
    <strong id="log-title">log</strong>
    <div>
      <button id="log-refresh" class="ghost small" data-i18n="refresh">Refresh</button>
      <button id="log-close" class="ghost small" data-i18n="close">Close</button>
    </div>
  </div>
  <pre id="log-body"></pre>
</dialog>

<dialog id="detail-dialog">
  <div class="dialog-head">
    <strong id="detail-title"></strong>
    <button id="detail-close" class="ghost small" data-i18n="close">Close</button>
  </div>
  <pre id="detail-body"></pre>
</dialog>

<template id="card-tpl">
  <article class="card">
    <div class="card-head">
      <img class="icon" alt="" width="64" height="64">
      <div class="title">
        <h2></h2>
        <div class="meta"><span class="pill state"></span><span class="port"></span><span class="pid"></span></div>
      </div>
    </div>
    <p class="purpose"></p>
    <div class="reason" hidden></div>
    <div class="proc" hidden></div>
    <div class="actions">
      <button class="primary act-window" data-i18n="open_window">Open window</button>
      <button class="act-browser" data-i18n="open_browser">Browser</button>
      <button class="act-start" data-i18n="start">Start</button>
      <button class="act-stop danger" data-i18n="stop">Stop</button>
      <button class="act-restart ghost" data-i18n="restart">Restart</button>
      <button class="act-close ghost" data-i18n="close_windows">Close windows</button>
      <button class="act-folder ghost" data-i18n="folder">Folder</button>
      <button class="act-log ghost" data-i18n="log">Log</button>
      <button class="act-detail ghost" title="details">⋯</button>
    </div>
  </article>
</template>

<dialog id="repo-dialog">
  <div class="dialog-head">
    <strong id="repo-title"></strong>
    <div>
      <button id="repo-copy-push" class="primary small" data-i18n="r_copy_push">Copy push command</button>
      <button id="repo-fetch" class="ghost small" data-i18n="r_fetch">Fetch</button>
      <button id="repo-folder" class="ghost small" data-i18n="r_folder">Open folder</button>
      <a id="repo-github" class="ghost small btn-link" target="_blank" rel="noopener noreferrer" hidden data-i18n="r_github">View on GitHub</a>
      <button id="repo-close" class="ghost small" data-i18n="close">Close</button>
    </div>
  </div>
  <div id="repo-body" class="repo-body"></div>
</dialog>

<dialog id="edit-dialog">
  <div class="dialog-head">
    <strong id="edit-title"></strong>
    <div>
      <button id="edit-save" class="primary small" data-i18n="f_save">Save</button>
      <button id="edit-close" class="ghost small" data-i18n="close">Close</button>
    </div>
  </div>
  <p class="hint" id="edit-hint"></p>
  <textarea id="edit-body" spellcheck="false"></textarea>
  <div id="edit-error" class="err"></div>
</dialog>

<script src="/ui/app.js"></script>
<script src="/ui/family.js"></script>
<script src="/ui/facets.js"></script>
</body>
</html>
